<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kinetic Clarity" />
  <title>Kinetic Clarity — Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0F172A',
            secondary: '#6366F1',
            tertiary: '#10B981',
            neutral: '#64748B',
            surface: '#F1F5F9',
            card: '#E2E8F0'
          },
          fontFamily: {
            headline: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #E2E8F0; color: #0F172A; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, h4, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row text-base">

  <!-- SIDEBAR -->
  <aside class="hidden md:flex flex-col w-72 bg-[#F8FAFC] border-r border-slate-300/80 p-6 justify-between shrink-0">
    <div>
      <div class="flex items-center gap-3.5 mb-8">
        <div class="w-11 h-11 rounded-2xl bg-primary text-white flex items-center justify-center shadow-md">
          <svg class="w-6 h-6 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <div>
          <h1 class="font-headline font-bold text-xl text-primary tracking-tight">Kinetic Clarity</h1>
          <p class="text-sm text-neutral font-medium">Sistema de Gestión</p>
        </div>
      </div>

      <nav class="space-y-2.5">
        <button onclick="setView('kanban')" id="nav-kanban-desk" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl text-base font-semibold bg-primary text-white shadow-sm transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Tablero Kanban
        </button>
        <button onclick="setView('gantt')" id="nav-gantt-desk" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl text-base font-semibold text-neutral hover:bg-slate-200/70 hover:text-primary transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="14" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="6" y1="18" x2="16" y2="18"/></svg>
          Cronograma Gantt
        </button>
        <button onclick="setView('agenda')" id="nav-agenda-desk" class="w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl text-base font-semibold text-neutral hover:bg-slate-200/70 hover:text-primary transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Agenda Calendario
        </button>
      </nav>

      <div class="mt-8 bg-slate-200/70 rounded-2xl p-4 space-y-3 border border-slate-300/60">
        <div class="flex justify-between items-center text-sm font-semibold">
          <span class="text-primary">Avance Global</span>
          <span id="progress-text" class="text-secondary">0%</span>
        </div>
        <div class="w-full bg-slate-300/80 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar-main" class="bg-primary h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="space-y-2.5 border-t border-slate-300 pt-5">
      <button onclick="openCategoryModal()" class="w-full text-sm font-semibold bg-secondary/15 text-secondary py-3 px-4 rounded-xl flex items-center justify-between">
        <span>Proyectos / Categorías</span>
        <span id="cat-count-badge" class="bg-secondary text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
      <button onclick="openConfigModal()" class="w-full text-sm font-medium bg-white text-primary border border-slate-300 py-3 px-4 rounded-xl flex items-center justify-between">
        <span>Google Sheets API</span>
        <span id="sync-indicator-desk" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
      </button>
      <button onclick="syncWithSheets()" class="w-full text-sm bg-primary text-white py-3 px-4 rounded-xl font-semibold">Sincronizar</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="bg-[#F8FAFC]/90 backdrop-blur-md border-b border-slate-300/80 px-4 md:px-8 py-4 flex flex-col gap-4">
      <div class="flex items-center justify-between gap-3">
        <div>
          <h2 id="view-title" class="font-headline text-2xl md:text-3xl font-bold text-primary">Tablero Kanban</h2>
          <p id="sync-status" class="text-sm text-neutral font-medium mt-0.5">Modo local listo</p>
        </div>
        <div class="flex items-center gap-2.5">
          <button onclick="openCategoryModal()" class="w-11 h-11 rounded-full bg-secondary text-white flex items-center justify-center shadow-sm"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></button>
          <button onclick="openTaskModal()" class="bg-primary text-white px-5 py-3 rounded-xl text-base font-semibold shadow-sm flex items-center gap-2">
            <span>+ Nueva Tarea</span>
          </button>
        </div>
      </div>
      <div class="flex items-center justify-between gap-3">
        <div class="relative flex-1 max-w-md">
          <input id="search-input" oninput="renderAll()" type="text" placeholder="Buscar tarea o proyecto..." class="w-full bg-[#DCE6F7]/70 border border-slate-300 rounded-xl px-4 py-2.5 text-base text-primary focus:outline-none" />
        </div>
        <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
      </div>
    </header>

    <!-- AREA DE VISTAS -->
    <section class="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8">
      
      <!-- KANBAN -->
      <div id="view-kanban" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl p-5 flex flex-col">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200"><span class="font-bold text-primary">Pendiente</span><span id="count-Pendiente" class="text-sm font-bold bg-slate-200 px-3 py-0.5 rounded-full">0</span></div>
          <div id="col-Pendiente" class="space-y-3.5 flex-1"></div>
        </div>
        <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl p-5 flex flex-col">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200"><span class="font-bold text-primary">En Progreso</span><span id="count-En Progreso" class="text-sm font-bold bg-secondary/15 text-secondary px-3 py-0.5 rounded-full">0</span></div>
          <div id="col-En Progreso" class="space-y-3.5 flex-1"></div>
        </div>
        <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl p-5 flex flex-col">
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200"><span class="font-bold text-primary">Completado</span><span id="count-Completado" class="text-sm font-bold bg-tertiary/15 text-tertiary px-3 py-0.5 rounded-full">0</span></div>
          <div id="col-Completado" class="space-y-3.5 flex-1"></div>
        </div>
      </div>

      <!-- GANTT REAL CORREGIDO (7 DÍAS) -->
      <div id="view-gantt" class="hidden bg-[#F8FAFC] border border-slate-300 rounded-3xl p-6 shadow-sm overflow-x-auto">
        <div class="mb-5"><h3 class="font-headline text-lg font-bold text-primary">Cronograma Gantt (Línea de Tiempo Semanal)</h3></div>
        <div id="gantt-container" class="min-w-[850px]"></div>
      </div>

      <!-- AGENDA -->
      <div id="view-agenda" class="hidden space-y-4">
        <div id="agenda-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </div>

    </section>
  </main>

  <!-- NAVEGACION MOVIL -->
  <nav class="md:hidden fixed bottom-4 left-4 right-4 bg-[#DCE6F7]/95 border border-slate-300 rounded-full flex justify-around items-center py-2 px-4 z-40 shadow-lg">
    <button onclick="setView('kanban')" class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center">📋</button>
    <button onclick="setView('gantt')" class="w-12 h-12 rounded-full text-primary flex items-center justify-center">📊</button>
    <button onclick="setView('agenda')" class="w-12 h-12 rounded-full text-primary flex items-center justify-center">📅</button>
  </nav>

  <!-- MODAL TAREA -->
  <div id="task-modal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl w-full max-w-lg p-6 md:p-8 space-y-5 shadow-2xl">
      <div class="flex items-center justify-between"><h3 id="task-modal-title" class="font-headline text-xl font-bold text-primary">Nueva Actividad</h3><button onclick="closeTaskModal()" class="text-neutral">✕</button></div>
      <div class="space-y-4">
        <div><label class="text-sm font-semibold text-neutral">Título</label><input id="inp-titulo" type="text" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-4 py-3 text-base" /></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-sm font-semibold text-neutral">Categoría</label><select id="inp-categoria" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-4 py-3 text-base"></select></div>
          <div><label class="text-sm font-semibold text-neutral">Estado</label><select id="inp-estado" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-4 py-3 text-base"><option value="Pendiente">Pendiente</option><option value="En Progreso">En Progreso</option><option value="Completado">Completado</option></select></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="text-sm font-semibold text-neutral">Inicio</label><input id="inp-inicio" type="date" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-3 py-2 text-base" /></div>
          <div><label class="text-sm font-semibold text-neutral">Fin</label><input id="inp-fin" type="date" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-3 py-2 text-base" /></div>
          <div><label class="text-sm font-semibold text-neutral">Hora</label><input id="inp-hora" type="time" value="09:00" class="w-full mt-1.5 bg-white border border-slate-300 rounded-xl px-3 py-2 text-base" /></div>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
        <button onclick="closeTaskModal()" class="px-5 py-2.5 rounded-xl border border-slate-300 text-primary font-semibold">Cancelar</button>
        <button onclick="saveTask()" class="px-6 py-2.5 rounded-xl bg-primary text-white font-semibold">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL CATEGORIAS -->
  <div id="category-modal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between"><h3 class="font-bold text-lg">Proyectos y Categorías</h3><button onclick="closeCategoryModal()">✕</button></div>
      <div class="flex gap-2"><input id="inp-new-category" type="text" placeholder="Nueva categoría..." class="flex-1 bg-white border border-slate-300 rounded-xl px-4 py-2 text-base" /><button onclick="addCategory()" class="bg-secondary text-white px-4 py-2 rounded-xl">Añadir</button></div>
      <div id="category-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
      <div class="flex justify-end"><button onclick="closeCategoryModal()" class="px-5 py-2 rounded-xl bg-primary text-white">Listo</button></div>
    </div>
  </div>

  <!-- MODAL CONFIG -->
  <div id="config-modal" class="hidden fixed inset-0 bg-primary/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <h3 class="font-bold text-lg">Google Sheets API</h3>
      <input id="inp-sheet-url" type="url" placeholder="https://script.google.com/.../exec" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-base" />
      <div class="flex justify-end gap-2"><button onclick="closeConfigModal()" class="px-4 py-2 rounded-xl border">Cerrar</button><button onclick="saveConfig()" class="px-5 py-2 rounded-xl bg-tertiary text-white">Conectar</button></div>
    </div>
  </div>

  <script>
    const todayStr = new Date().toISOString().split('T')[0];
    let categories = JSON.parse(localStorage.getItem('kc_categories')) || ['Visión', 'Negocios', 'Clases', 'Familia', 'Salud', 'Podcast', 'Avaluó'];
    let tasks = JSON.parse(localStorage.getItem('kc_tasks')) || [
      { id: '1', titulo: 'Definir metas estratégicas de la semana', categoria: 'Visión', estado: 'Completado', inicio: todayStr, fin: todayStr, hora: '08:00' },
      { id: '2', titulo: 'Capsula 1', categoria: 'Podcast', estado: 'Pendiente', inicio: todayStr, fin: todayStr, hora: '21:00' },
      { id: '3', titulo: 'Hacer topografía', categoria: 'Avaluó', estado: 'En Progreso', inicio: todayStr, fin: todayStr, hora: '13:00' },
      { id: '4', titulo: 'Hacer presentaciones de Secundaria', categoria: 'Clases', estado: 'Pendiente', inicio: '2026-10-20', fin: '2026-10-22', hora: '13:00' }
    ];
    let sheetUrl = localStorage.getItem('kc_sheet_url') || 'https://script.google.com/macros/s/AKfycbzG0BvrSWpGxsJ58nNPEEhYK5cziomgS-y6imF3Ba8NE3hs_Ay9Y9ZCsGf7ZYyWyYMh_w/exec';
    let editingTaskId = null;
    let activeCategoryFilter = 'Todas';

    const iconEdit = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`;
    const iconTrash = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

    function saveLocal() {
      localStorage.setItem('kc_tasks', JSON.stringify(tasks));
      localStorage.setItem('kc_categories', JSON.stringify(categories));
      renderAll();
      pushToSheets();
    }

    function setView(view) {
      ['kanban', 'gantt', 'agenda'].forEach(v => {
        document.getElementById(`view-${v}`).classList.toggle('hidden', v !== view);
      });
      const titles = { kanban: 'Tablero Kanban', gantt: 'Cronograma Gantt', agenda: 'Agenda Calendario' };
      document.getElementById('view-title').innerText = titles[view];
    }

    function getFilteredTasks() {
      const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
      return tasks.filter(t => {
        const matchCat = activeCategoryFilter === 'Todas' || t.categoria === activeCategoryFilter;
        const matchQuery = !q || (t.titulo || '').toLowerCase().includes(q) || (t.categoria || '').toLowerCase().includes(q);
        return matchCat && matchQuery;
      });
    }

    function updateProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.estado === 'Completado').length;
      const pctDone = total ? Math.round((done / total) * 100) : 0;
      document.getElementById('progress-text').innerText = `${pctDone}%`;
      document.getElementById('progress-bar-main').style.width = `${pctDone}%`;
      document.getElementById('cat-count-badge').innerText = categories.length;
    }

    function renderCategoryFilters() {
      const container = document.getElementById('category-filters');
      const allCats = ['Todas', ...categories];
      container.innerHTML = allCats.map(c => `
        <button onclick="setCategoryFilter('${c}')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${c === activeCategoryFilter ? 'bg-primary text-white shadow-sm' : 'bg-white text-primary border border-slate-300'}">${c}</button>
      `).join('');
    }

    function setCategoryFilter(cat) {
      activeCategoryFilter = cat;
      renderAll();
    }

    function renderAll() {
      updateProgress();
      renderCategoryFilters();
      renderKanban();
      renderGantt();
      renderAgenda();
    }

    function renderKanban() {
      const list = getFilteredTasks();
      ['Pendiente', 'En Progreso', 'Completado'].forEach(estado => {
        const col = document.getElementById(`col-${estado}`);
        const filtered = list.filter(t => t.estado === estado);
        document.getElementById(`count-${estado}`).innerText = filtered.length;
        col.innerHTML = filtered.map(t => `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3 shadow-sm">
            <div class="flex justify-between items-center"><span class="text-xs font-bold px-3 py-1 rounded-lg bg-primary text-white">${t.categoria}</span><div class="flex gap-1"><button onclick="openTaskModal('${t.id}')" class="w-8 h-8 rounded-lg bg-emerald-950 text-tertiary flex items-center justify-center">${iconEdit}</button><button onclick="deleteTask('${t.id}')" class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center">${iconTrash}</button></div></div>
            <p class="text-base font-semibold text-primary">${t.titulo}</p>
            <div class="flex items-center justify-between pt-2 border-t text-sm text-neutral">
              <span>📅 ${t.inicio}</span>
              <select onchange="changeStatus('${t.id}', this.value)" class="bg-slate-100 rounded-lg px-2 py-1 text-xs font-semibold"><option value="Pendiente" ${t.estado==='Pendiente'?'selected':''}>Pendiente</option><option value="En Progreso" ${t.estado==='En Progreso'?'selected':''}>En Progreso</option><option value="Completado" ${t.estado==='Completado'?'selected':''}>Completado</option></select>
            </div>
          </div>
        `).join('');
      });
    }

    // ==========================================
    // GANTT REAL CON POSICIONAMIENTO PRECISO POR DÍA
    // ==========================================
    function renderGantt() {
      const container = document.getElementById('gantt-container');
      const list = getFilteredTasks();
      if (list.length === 0) {
        container.innerHTML = '<p class="text-base text-neutral p-4">No hay tareas para mostrar.</p>';
        return;
      }

      let baseDate = new Date();
      let days = [];
      for (let i = 0; i < 7; i++) {
        let d = new Date(baseDate);
        d.setDate(baseDate.getDate() + i);
        days.push(d.toISOString().split('T')[0]);
      }

      let headerHtml = `
        <div class="grid grid-cols-12 bg-slate-200 rounded-xl p-3 mb-3 text-xs font-bold text-primary">
          <div class="col-span-5">Proyecto / Tarea</div>
          <div class="col-span-7 grid grid-cols-7 text-center">
            ${days.map(date => `<div>${date.slice(5)}</div>`).join('')}
          </div>
        </div>
      `;

      let rowsHtml = list.map(t => {
        const start = t.inicio || todayStr;
        const end = t.fin || start;
        const barColor = t.estado === 'Completado' ? 'bg-tertiary' : t.estado === 'En Progreso' ? 'bg-secondary' : 'bg-primary';

        let startIndex = days.indexOf(start);
        let endIndex = days.indexOf(end);
        if (startIndex === -1) startIndex = start < days[0] ? 0 : 6;
        if (endIndex === -1) endIndex = end > days[6] ? 6 : startIndex;
        if (endIndex < startIndex) endIndex = startIndex;

        let leftPercent = (startIndex / 7) * 100;
        let widthPercent = Math.max(((endIndex - startIndex + 1) / 7) * 100, 14.28);

        return `
          <div class="grid grid-cols-12 items-center gap-2 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm mb-2.5">
            <div class="col-span-5 pr-2 truncate">
              <p class="text-sm font-bold text-primary truncate">${t.titulo}</p>
              <p class="text-xs text-neutral">${t.inicio} → ${t.fin} · <span class="font-semibold text-secondary">${t.categoria}</span></p>
            </div>
            
            <div class="col-span-7 relative bg-slate-100 h-9 rounded-xl px-1 flex items-center">
              <div class="absolute inset-0 grid grid-cols-7 px-1 pointer-events-none">
                ${days.map(() => `<div class="border-r border-slate-200 h-full"></div>`).join('')}
              </div>
              <div class="absolute h-7 ${barColor} rounded-lg px-2 flex items-center justify-between text-[11px] font-bold text-white shadow-sm" style="left: ${leftPercent}%; width: ${widthPercent}%;">
                <span class="truncate">${t.estado}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = headerHtml + rowsHtml;
    }

    function renderAgenda() {
      const container = document.getElementById('agenda-container');
      const list = getFilteredTasks();
      const grouped = {};
      list.forEach(t => {
        if (!grouped[t.inicio]) grouped[t.inicio] = [];
        grouped[t.inicio].push(t);
      });
      const dates = Object.keys(grouped).sort();
      container.innerHTML = dates.map(date => `
        <div class="bg-[#F8FAFC] border border-slate-300 rounded-3xl p-5 space-y-3 shadow-sm">
          <h4 class="font-bold text-base text-primary border-b pb-2">${date}</h4>
          ${grouped[date].map(t => `
            <div class="bg-white border border-slate-200 p-3 rounded-2xl flex justify-between items-center">
              <div><span class="text-xs font-bold text-secondary mr-2">${t.hora || '09:00'}</span><span class="text-sm font-semibold">${t.titulo}</span></div>
              <button onclick="openTaskModal('${t.id}')" class="w-7 h-7 rounded bg-emerald-950 text-tertiary flex items-center justify-center">${iconEdit}</button>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function populateCategorySelect(selectedCat) {
      const sel = document.getElementById('inp-categoria');
      sel.innerHTML = categories.map(c => `<option value="${c}" ${c === selectedCat ? 'selected' : ''}>${c}</option>`).join('');
    }

    function openTaskModal(taskId = null) {
      editingTaskId = taskId;
      if (taskId) {
        const t = tasks.find(item => String(item.id) === String(taskId));
        if (!t) return;
        document.getElementById('task-modal-title').innerText = 'Editar Actividad';
        document.getElementById('inp-titulo').value = t.titulo;
        populateCategorySelect(t.categoria);
        document.getElementById('inp-estado').value = t.estado;
        document.getElementById('inp-inicio').value = t.inicio || todayStr;
        document.getElementById('inp-fin').value = t.fin || todayStr;
        document.getElementById('inp-hora').value = t.hora || '09:00';
      } else {
        document.getElementById('task-modal-title').innerText = 'Nueva Actividad';
        document.getElementById('inp-titulo').value = '';
        populateCategorySelect(activeCategoryFilter !== 'Todas' ? activeCategoryFilter : categories[0]);
        document.getElementById('inp-estado').value = 'Pendiente';
        document.getElementById('inp-inicio').value = todayStr;
        document.getElementById('inp-fin').value = todayStr;
        document.getElementById('inp-hora').value = '09:00';
      }
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeTaskModal() { document.getElementById('task-modal').classList.add('hidden'); }

    function saveTask() {
      const titulo = document.getElementById('inp-titulo').value.trim();
      if (!titulo) return;
      const taskData = {
        titulo,
        categoria: document.getElementById('inp-categoria').value || 'General',
        estado: document.getElementById('inp-estado').value,
        inicio: document.getElementById('inp-inicio').value || todayStr,
        fin: document.getElementById('inp-fin').value || todayStr,
        hora: document.getElementById('inp-hora').value || '09:00'
      };
      if (editingTaskId) {
        tasks = tasks.map(t => String(t.id) === String(editingTaskId) ? { ...t, ...taskData } : t);
      } else {
        tasks.push({ id: Date.now().toString(), ...taskData });
      }
      closeTaskModal();
      saveLocal();
    }

    function changeStatus(id, newStatus) {
      tasks = tasks.map(t => String(t.id) === String(id) ? { ...t, estado: newStatus } : t);
      saveLocal();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => String(t.id) !== String(id));
      saveLocal();
    }

    function openCategoryModal() {
      renderCategoryList();
      document.getElementById('category-modal').classList.remove('hidden');
    }
    function closeCategoryModal() { document.getElementById('category-modal').classList.add('hidden'); }
    function renderCategoryList() {
      document.getElementById('category-list').innerHTML = categories.map((c, idx) => `
        <div class="flex justify-between items-center bg-white border p-2.5 rounded-xl"><span class="font-semibold">${c}</span><button onclick="categories.splice(${idx},1);saveLocal();renderCategoryList();" class="w-7 h-7 rounded-full bg-red-600 text-white">✕</button></div>
      `).join('');
    }
    function addCategory() {
      const val = document.getElementById('inp-new-category').value.trim();
      if (!val || categories.includes(val)) return;
      categories.push(val);
      document.getElementById('inp-new-category').value = '';
      saveLocal();
      renderCategoryList();
    }

    function openConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); }
    function closeConfigModal() { document.getElementById('config-modal').classList.add('hidden'); }
    function saveConfig() {
      sheetUrl = document.getElementById('inp-sheet-url').value.trim();
      localStorage.setItem('kc_sheet_url', sheetUrl);
      closeConfigModal();
    }

    async function syncWithSheets() {
      if (!sheetUrl) return;
      try {
        const res = await fetch(sheetUrl);
        const json = await res.json();
        if (json.status === 'ok' && Array.isArray(json.data) && json.data.length > 0) {
          tasks = json.data;
          localStorage.setItem('kc_tasks', JSON.stringify(tasks));
          renderAll();
        }
      } catch (e) {}
    }

    async function pushToSheets() {
      if (!sheetUrl) return;
      try {
        await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ tasks }) });
      } catch (e) {}
    }

    renderAll();
    if (sheetUrl) syncWithSheets();
  </script>
</body>
</html>
